<p-toast></p-toast>
<div class="h-full w-full bg-white rounded-2xl shadow-lg p-12 flex flex-col">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col gap-8 flex-1">
    <h2 class="text-3xl font-bold text-center mb-4">Cadastro de Usuário</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div>
        <label for="username" class="block text-base font-medium text-gray-700 mb-1">Usuário</label>
        <input pInputText id="username" formControlName="username" type="text" class="w-full text-lg py-2" placeholder="Usuário" [class.p-invalid]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" />
        <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="text-xs text-red-500 mt-1">Usuário é obrigatório</div>
      </div>
      <div>
        <label for="password" class="block text-base font-medium text-gray-700 mb-1">Senha</label>
        <input pInputText id="password" formControlName="password" type="password" class="w-full text-lg py-2" placeholder="Senha" [class.p-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" />
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-xs text-red-500 mt-1">Senha é obrigatória</div>
      </div>
      <div>
        <label for="nome" class="block text-base font-medium text-gray-700 mb-1">Nome</label>
        <input pInputText id="nome" formControlName="nome" type="text" class="w-full text-lg py-2" placeholder="Nome completo" [class.p-invalid]="registerForm.get('nome')?.invalid && registerForm.get('nome')?.touched" />
        <div *ngIf="registerForm.get('nome')?.invalid && registerForm.get('nome')?.touched" class="text-xs text-red-500 mt-1">Nome é obrigatório</div>
      </div>
      <div>
        <label for="cpf" class="block text-base font-medium text-gray-700 mb-1">CPF</label>
        <input pInputText id="cpf" formControlName="cpf" type="text" class="w-full text-lg py-2" placeholder="Somente números" maxlength="11" [class.p-invalid]="registerForm.get('cpf')?.invalid && registerForm.get('cpf')?.touched" />
        <div *ngIf="registerForm.get('cpf')?.invalid && registerForm.get('cpf')?.touched" class="text-xs text-red-500 mt-1">CPF deve conter 11 dígitos numéricos</div>
      </div>
    </div>
    <div class="flex justify-center">
      <div class="w-1/3">
        <p-button
          label="Registrar"
          icon="pi pi-user-plus"
          styleClass="p-button-lg p-button-rounded p-button-success px-10 py-3 text-base w-full"
          [disabled]="registerForm.invalid || isRegistering"
          type="submit"
        ></p-button>
      </div>
    </div>
    <div *ngIf="registerError" class="text-red-500 text-center mt-2">{{ registerError }}</div>
    <div *ngIf="registerSuccess" class="text-green-600 text-center mt-2">Usuário cadastrado com sucesso!</div>
  </form>
</div>
