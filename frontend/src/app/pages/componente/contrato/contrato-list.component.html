<p-toast></p-toast>

<div class="flex flex-col gap-4 w-full">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">Contratos</h2>
    <button pButton type="button" label="Novo Contrato" icon="pi pi-plus" (click)="novoContrato()"></button>
  </div>
  <p-table [value]="contratos" class="w-full">
    <ng-template pTemplate="header">
      <tr>
        <th>Código</th>
        <th>ID Área</th>
        <th>Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-contrato>
      <tr>
        <td>{{ contrato.codigoContrato }}</td>
        <td>{{ contrato.idArea }}</td>
        <td>
          <button pButton icon="pi pi-eye" class="p-button-text p-button-sm" (click)="detalharContrato(contrato)" pTooltip="Detalhar"></button>
          <button pButton icon="pi pi-plus" class="p-button-text p-button-sm text-green-600" (click)="abrirNovoDetalhe(contrato)" pTooltip="Adicionar Detalhe"></button>
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="editarContrato(contrato)"></button>
          <button pButton icon="pi pi-trash text-red-500" class="p-button-text p-button-sm" (click)="pedirConfirmacaoExclusao(contrato)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <p-dialog [(visible)]="displayForm" [modal]="true" [closable]="false" [style]="{width: '400px'}">
    <app-contrato-form [contrato]="contratoSelecionado" (fechar)="fecharForm($event)"></app-contrato-form>
  </p-dialog>
  <p-dialog [(visible)]="displayDetalhes" [modal]="true" [closable]="true" [style]="{width: '900px'}" (onHide)="fecharDetalhes()">
    <app-contrato-detalhe-list *ngIf="contratoDetalheCodigo" [codigoContrato]="contratoDetalheCodigo"></app-contrato-detalhe-list>
  </p-dialog>
  <p-dialog [(visible)]="displayNovoDetalhe" [modal]="true" [closable]="true" [style]="{width: '600px'}" (onHide)="fecharNovoDetalhe(false)">
    <app-contrato-detalhe-form [codigoContrato]="contratoParaNovoDetalhe" (fechar)="fecharNovoDetalhe($event)"></app-contrato-detalhe-form>
  </p-dialog>
  <p-dialog [(visible)]="mostrarConfirmacaoExclusao" [modal]="true" [closable]="false" [style]="{width: '400px'}">
    <div class="text-center py-4">
      <i class="pi pi-exclamation-triangle text-4xl text-yellow-500 mb-4"></i>
      <p class="text-lg mb-4">Deseja realmente excluir este contrato?</p>
      <p class="text-sm text-gray-600">Esta ação não pode ser desfeita.</p>
    </div>
    <ng-template pTemplate="footer">
      <div class="flex justify-end gap-2">
        <button pButton type="button" label="Cancelar" class="p-button-outlined" (click)="cancelarExclusao()"></button>
        <button pButton type="button" label="Excluir" class="p-button-danger" (click)="confirmarExclusao()"></button>
      </div>
    </ng-template>
  </p-dialog>
</div>
