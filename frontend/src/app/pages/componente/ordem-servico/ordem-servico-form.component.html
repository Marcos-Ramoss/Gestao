<p-toast></p-toast>

<form (ngSubmit)="salvar()" #form="ngForm" class="space-y-4">
  <div *ngIf="erro" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
    {{ erro }}
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="field">
      <label for="areaId" class="block text-sm font-medium text-gray-700 mb-2">
        Área *
      </label>
      <p-dropdown
        id="areaId"
        name="areaId"
        [(ngModel)]="formData.areaId"
        [options]="areas"
        optionLabel="nome"
        optionValue="id"
        placeholder="Selecione uma área"
        class="w-full"
        (onChange)="limparErro()"
        [class.ng-invalid]="!formData.areaId && form.submitted">
      </p-dropdown>
    </div>

    <div class="field">
      <label for="numeroOs" class="block text-sm font-medium text-gray-700 mb-2">
        Número da OS *
      </label>
      <input
        id="numeroOs"
        name="numeroOs"
        type="text"
        pInputText
        [(ngModel)]="formData.numeroOs"
        placeholder="Digite o número da OS"
        class="w-full"
        (input)="limparErro()"
        [class.ng-invalid]="!formData.numeroOs && form.submitted"
        required>
    </div>
  </div>

  <div class="flex justify-end gap-3 pt-4">
    <button
      type="button"
      pButton
      label="Cancelar"
      class="p-button-outlined"
      (click)="cancelar()"
      [disabled]="carregando">
    </button>
    <button
      type="submit"
      pButton
      [label]="editando ? 'Atualizar' : 'Salvar'"
      [icon]="editando ? 'pi pi-check' : 'pi pi-plus'"
      class="p-button-success"
      [loading]="carregando"
      [disabled]="carregando">
    </button>
  </div>
</form>
