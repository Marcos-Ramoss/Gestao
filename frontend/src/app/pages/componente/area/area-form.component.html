<form [formGroup]="areaForm" (ngSubmit)="onSubmit()" class="space-y-10 w-full max-w-6xl mx-auto border border-gray-200 rounded-lg shadow-md p-6 bg-white">
  <div>
    <div class="flex flex-col items-center">
      <label for="nome" class="block font-semibold mb-1 text-center">Nome da Área</label>
      <input
        id="nome"
        type="text"
        pInputText
        formControlName="nome"
        maxlength="100"
        class="w-[30%] min-w-[220px] max-w-md mx-auto"
        placeholder="Digite o nome da área"
      />
    </div>
    <div *ngIf="areaForm.get('nome')?.touched && areaForm.get('nome')?.invalid" class="text-red-500 text-xs mt-1">
      <span *ngIf="areaForm.get('nome')?.errors?.['required']">O nome é obrigatório.</span>
      <span *ngIf="areaForm.get('nome')?.errors?.['maxlength']">Máximo de 100 caracteres.</span>
    </div>
  </div>

  <div class="flex justify-center gap-2 mt-4">
    <button
      pButton
      type="submit"
      label="Salvar"
      [disabled]="carregando"
      class="p-button-success"
      style="width: 30vw; min-width: 120px; max-width: 200px;"
    ></button>
    <button
      pButton
      type="button"
      label="Cancelar"
      [disabled]="carregando"
      class="p-button-secondary"
      (click)="router.navigate(['/app/areas'])"
      style="width: 30vw; min-width: 120px; max-width: 200px;"
    ></button>
  </div>

  <div *ngIf="sucesso" class="text-green-600 mt-2">{{ sucesso }}</div>
  <div *ngIf="erro" class="text-red-600 mt-2">{{ erro }}</div>
  <p-toast></p-toast>
</form>
