<p-toast></p-toast>
<div class="h-full w-full bg-white rounded-2xl shadow-lg p-12 flex flex-col">
  <form [formGroup]="uploadForm" class="w-full flex flex-col gap-8 flex-1">
    <h4 class="text-3xl font-bold text-center mb-4">Relatórios de Atividade</h4>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
      <div>
        <label for="ano" class="block text-base font-medium text-gray-700 mb-1">Ano</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-calendar"></i>
          <input pInputText id="ano" formControlName="ano" type="number" class="w-full max-w-[120px] text-lg py-2" placeholder="Ano" [class.p-invalid]="uploadForm.get('ano')?.invalid && uploadForm.get('ano')?.touched" />
        </span>
        <div *ngIf="uploadForm.get('ano')?.invalid && uploadForm.get('ano')?.touched" class="text-xs text-red-500 mt-1">Ano é obrigatório</div>
      </div>
      <div>
        <label for="mes" class="block text-base font-medium text-gray-700 mb-1">Mês</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-calendar-times"></i>
          <input pInputText id="mes" formControlName="mes" type="number" class="w-full max-w-[120px] text-lg py-2" placeholder="Mês (1-12)" [class.p-invalid]="uploadForm.get('mes')?.invalid && uploadForm.get('mes')?.touched" />
        </span>
        <div *ngIf="uploadForm.get('mes')?.invalid && uploadForm.get('mes')?.touched" class="text-xs text-red-500 mt-1">Mês é obrigatório</div>
      </div>
      <div class="flex flex-col justify-end h-full">
        <label class="block text-base font-medium text-gray-700 mb-1">Arquivos PDF</label>
       
      </div>
    </div>
   
    <div *ngIf="uploadForm.get('files')?.invalid && uploadForm.get('files')?.touched" class="text-xs text-red-500 mt-1">Selecione ao menos um arquivo</div>
    <div *ngIf="uploadError" class="text-red-500 text-center mt-2">{{ uploadError }}</div>
    <p-button
      label="Pesquisar"
      icon="pi pi-search"
      (click)="pesquisarRelatorios()"
      [disabled]="uploadForm.get('ano')?.invalid || uploadForm.get('mes')?.invalid"
      class="ml-2 p-button-info"
    ></p-button>
  </form>
</div>

<!-- Botão de exportação -->
<div *ngIf="relatorios.length > 0" class="w-full mx-auto mt-8">
  <p-button label="Exportar Excel" icon="pi pi-file-excel" class="mb-4" (click)="exportarExcel()" styleClass="p-button-success"></p-button>
  <div class="max-h-96 overflow-y-auto">
    <p-table [value]="relatorios" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Cliente</th>
          <th>Ano</th>
          <th>Mês</th>
          <th>Colaborador</th>
          <th>Projeto</th>
          <th>Horas</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-rel>
        <tr>
          <td>{{ rel.cliente }}</td>
          <td>{{ rel.ano }}</td>
          <td>{{ rel.mes }}</td>
          <td>{{ rel.colaborador }}</td>
          <td>{{ rel.nomeProjeto }}</td>
          <td>{{ rel.horaTotalProjeto }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
