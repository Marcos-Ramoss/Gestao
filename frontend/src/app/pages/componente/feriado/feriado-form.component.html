<p-toast></p-toast>
<div class="w-full max-w-xs p-8 flex flex-col items-center justify-center">
  <form [formGroup]="feriadoForm" class="w-full flex flex-col gap-8" (ngSubmit)="onSubmit()">
    <h2 class="text-2xl font-bold text-center mb-4">{{ feriado ? 'Editar Feriado' : 'Novo Feriado' }}</h2>
    <div>
      <label for="data" class="block text-base font-medium text-gray-700 mb-1">Data</label>
      <p-calendar
        id="data"
        [showIcon]="true"
        [dateFormat]="'dd/mm/yy'"
        [(ngModel)]="dataSelecionada"
        (onSelect)="onCalendarChange($event)"
        [readonlyInput]="carregando"
        [showButtonBar]="true"
        [touchUI]="true"
        [panelStyle]="{ minWidth: '16rem' }"
        [placeholder]="'DD/MM/AAAA'"
        [inputStyleClass]="'w-full text-lg py-2'"
        [ngModelOptions]="{standalone: true}"
      ></p-calendar>
      <div *ngIf="feriadoForm.get('data')?.errors?.['formato'] && feriadoForm.get('data')?.touched" class="text-xs text-red-500 mt-1">Formato deve ser DD/MM/AAAA</div>
      <div *ngIf="feriadoForm.get('data')?.errors?.['invalida'] && feriadoForm.get('data')?.touched" class="text-xs text-red-500 mt-1">Data inválida</div>
      <div *ngIf="feriadoForm.get('data')?.errors?.['required'] && feriadoForm.get('data')?.touched" class="text-xs text-red-500 mt-1">Data é obrigatória</div>
    </div>
    <div class="flex justify-center mt-6">
      <button type="submit" pButton icon="pi pi-save" label="Salvar" class="p-button-success" [disabled]="feriadoForm.invalid || carregando"></button>
    </div>
    <div *ngIf="erro" class="text-red-500 text-center mt-2">{{ erro }}</div>
    <div *ngIf="sucesso" class="text-green-600 text-center mt-2">{{ sucesso }}</div>
  </form>
</div>
