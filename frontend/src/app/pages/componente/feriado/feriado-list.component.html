<div class="w-full bg-white rounded-2xl shadow-lg p-8 flex flex-col">
  <h2 class="text-2xl font-bold mb-6">Lista de Feriados</h2>
  <div class="flex justify-end mb-4">
    <button pButton type="button" icon="pi pi-plus" label="Novo Feriado" class="p-button-success" (click)="novoFeriado()"></button>
  </div>
  <div *ngIf="carregando" class="text-center text-gray-500">Carregando...</div>
  <div *ngIf="erro" class="text-red-500 text-center mb-4">{{ erro }}</div>
  <p-table *ngIf="!carregando && feriados.length > 0" [value]="feriados" responsiveLayout="scroll" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20,50]">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Data</th>
        <th>Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-feriado>
      <tr>
        <td>{{ feriado.id }}</td>
        <td>{{ feriado.data | date:'dd/MM/yyyy' }}</td>
        <td>
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm mr-2" (click)="editarFeriado(feriado.id)"></button>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deletarFeriado(feriado.id)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Modal de edição -->
  <p-dialog header="Editar Feriado" [(visible)]="exibirModalEdicao" [modal]="true" [closable]="false" [style]="{width: '500px', height: '400px'}">
    <app-feriado-form *ngIf="feriadoSelecionado" [feriado]="feriadoSelecionado" (salvo)="aoSalvarEdicao()"></app-feriado-form>
    <ng-template pTemplate="footer">
      <button pButton label="Fechar" class="p-button-outlined" (click)="exibirModalEdicao=false"></button>
    </ng-template>
  </p-dialog>

  <!-- Modal de confirmação de exclusão -->
  <p-dialog header="Confirmação" [(visible)]="exibirModalExclusao" [modal]="true" [closable]="false" [style]="{width: '350px'}">
    <div class="flex items-center gap-3">
      <i class="pi pi-exclamation-triangle text-2xl text-red-500"></i>
      <span>Tem certeza que deseja excluir este feriado?</span>
    </div>
    <ng-template pTemplate="footer">
      <button pButton label="Cancelar" class="p-button-outlined" (click)="cancelarExclusao()"></button>
      <button pButton label="Excluir" class="p-button-danger" (click)="confirmarExclusao()"></button>
    </ng-template>
  </p-dialog>

  <p-toast></p-toast>
  <div *ngIf="!carregando && feriados.length === 0" class="text-center text-gray-500">Nenhum feriado cadastrado.</div>
</div>
