<div class="w-full bg-white rounded-2xl shadow-lg p-8 flex flex-col">
  <h2 class="text-2xl font-bold mb-6">Lista de Feriados</h2>
  <div class="flex justify-end mb-4">
    <button pButton type="button" icon="pi pi-plus" label="Novo Feriado" class="p-button-success" (click)="novoFeriado()"></button>
  </div>
  <div *ngIf="carregando" class="text-center text-gray-500">Carregando...</div>
  <div *ngIf="erro" class="text-red-500 text-center mb-4">{{ erro }}</div>
  <p-table *ngIf="!carregando && feriados.length > 0" [value]="feriados" responsiveLayout="scroll" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20,50]">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Data</th>
        <th>Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-feriado>
      <tr>
        <td>{{ feriado.id }}</td>
        <td>{{ feriado.data }}</td>
        <td>
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm mr-2" (click)="editarFeriado(feriado.id)"></button>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deletarFeriado(feriado.id)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <div *ngIf="!carregando && feriados.length === 0" class="text-center text-gray-500">Nenhum feriado cadastrado.</div>
</div>
