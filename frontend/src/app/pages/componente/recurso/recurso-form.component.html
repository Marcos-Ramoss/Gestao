<p-toast></p-toast>
<form [formGroup]="recursoForm" class="space-y-10 w-full max-w-6xl mx-auto border border-gray-200 rounded-lg shadow-md p-6 bg-white" (ngSubmit)="onSubmit()">
  <h2 class="text-2xl font-bold text-center mb-4">{{ recurso ? 'Editar Recurso' : 'Novo Recurso' }}</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
    <div class="col-span-2 md:col-span-1">
      <label for="codigoContrato" class="block mb-1 font-medium">Código Contrato</label>
      <p-dropdown formControlName="codigoContrato" 
                  [options]="contratos" 
                  optionLabel="codigoContrato" 
                  optionValue="codigoContrato"
                  placeholder="Selecione o contrato"
                  [filter]="true"
                  class="w-full">
      </p-dropdown>
      <div *ngIf="recursoForm.get('codigoContrato')?.invalid && recursoForm.get('codigoContrato')?.touched" class="text-xs text-red-500">Código Contrato é obrigatório</div>
    </div>
    <div class="col-span-2 md:col-span-1">
      <label for="nome" class="block mb-1 font-medium">Nome</label>
      <input pInputText id="nome" formControlName="nome" type="text" class="w-full" [readonly]="carregando" />
      <div *ngIf="recursoForm.get('nome')?.invalid && recursoForm.get('nome')?.touched" class="text-xs text-red-500">Nome é obrigatório</div>
    </div>
    <div class="col-span-2 md:col-span-1">
      <label for="fatorAjuste" class="block mb-1 font-medium">Fator Ajuste</label>
      <p-inputNumber id="fatorAjuste" formControlName="fatorAjuste" class="w-full" [readonly]="carregando"></p-inputNumber>
      <div *ngIf="recursoForm.get('fatorAjuste')?.invalid && recursoForm.get('fatorAjuste')?.touched" class="text-xs text-red-500">Fator Ajuste é obrigatório e deve ser maior ou igual a 0</div>
    </div>
  </div>
  <div class="flex justify-center mt-6">
    <button type="submit" pButton icon="pi pi-save" label="Salvar" class="p-button-success" [disabled]="recursoForm.invalid || carregando"></button>
  </div>
  <div *ngIf="erro" class="text-red-500 text-center mt-2">{{ erro }}</div>
  <div *ngIf="sucesso" class="text-green-600 text-center mt-2">{{ sucesso }}</div>
</form>
