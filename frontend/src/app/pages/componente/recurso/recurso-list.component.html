<div class="h-full w-full bg-white rounded-2xl shadow-lg p-8 flex flex-col">
  <h2 class="text-2xl font-bold mb-6">Lista de Recursos</h2>
  <div class="flex justify-end mb-4">
    <button pButton type="button" icon="pi pi-plus" label="Novo Recurso" class="p-button-success" (click)="novoRecurso()"></button>
  </div>
  <div *ngIf="carregando" class="text-center text-gray-500">Carregando...</div>
  <div *ngIf="erro" class="text-red-500 text-center mb-4">{{ erro }}</div>
  <p-table *ngIf="!carregando && recursos.length > 0" [value]="recursos" responsiveLayout="scroll" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20,50]">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Código Contrato</th>
        <th>Nome</th>
        <th>Fator Ajuste</th>
        <th>Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-recurso>
      <tr>
        <td>{{ recurso.id }}</td>
        <td>{{ recurso.codigoContrato }}</td>
        <td>{{ recurso.nome }}</td>
        <td>{{ recurso.fatorAjuste }}</td>
        <td>
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm mr-2" (click)="editarRecurso(recurso.id)"></button>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deletarRecurso(recurso.id)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <div *ngIf="!carregando && recursos.length === 0" class="text-center text-gray-500">Nenhum recurso cadastrado.</div>
  <p-dialog class="no-dialog-border" header="Editar Recurso" [(visible)]="exibirModalEdicao" [modal]="true" [style]="{width: '500px'}" (onHide)="exibirModalEdicao = false">
    <app-recurso-form [recurso]="recursoSelecionado" (salvo)="aoSalvarEdicao()"></app-recurso-form>
  </p-dialog>
  <p-dialog class="no-dialog-border" header="Confirmar Exclusão" [(visible)]="exibirModalExclusao" [modal]="true" [style]="{width: '350px'}" (onHide)="cancelarExclusao()">
    <div class="text-center">
      <p>Tem certeza que deseja excluir o recurso <b>{{ recursoSelecionado?.nome }}</b>?</p>
      <div class="flex justify-center gap-4 mt-6">
        <button pButton type="button" label="Cancelar" class="p-button-secondary" (click)="cancelarExclusao()"></button>
        <button pButton type="button" label="Excluir" class="p-button-danger" (click)="confirmarExclusao()"></button>
      </div>
    </div>
  </p-dialog>
</div>
