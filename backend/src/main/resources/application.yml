spring:
  application:
    name: otimizando_relatorios

  datasource:
    url: jdbc:mysql://localhost:3306/brethdb?createDatabaseIfNotExist=true
    username: brethuser
    password: brethpass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html 